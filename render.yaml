services:
  # 1. Rust Backend API
  - type: web
    name: aisana-backend
    runtime: rust
    plan: free
    rootDir: backend
    buildCommand: cargo build --release
    startCommand: ./target/release/aisana-api
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

  # 2. Next.js Frontend
  - type: web
    name: aisana-frontend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RUST_API_URL
        fromService:
          type: web
          name: aisana-backend
          property: host
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
